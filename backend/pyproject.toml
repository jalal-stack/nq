[project]
name = "trademind"
version = "0.1.0"
description = "TradeMind AI - quantitative research and paper-trading platform (paper trading only)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
providers = ["ccxt>=4.3", "yfinance>=0.2.40"]
server = ["gunicorn>=22"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trademind*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
